appId: com.diegopinochet.playbook
productName: Playbook
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
files:
  - "out/**/*"
  - "package.json"
  - "!**/node_modules/@playbook/**"
  - "!**/.turbo/**"
  - "!**/*.tsbuildinfo"
asarUnpack:
  - "node_modules/ffmpeg-static/**"
# No dependency ships a node-gyp addon (ffmpeg-static is a plain executable), so there is
# nothing to rebuild against Electron's ABI. Leaving this on makes @electron/rebuild walk
# pnpm's hoisted symlink farm, where it dies on ENOENT stat'ing @emnapi/runtime.
npmRebuild: false
mac:
  category: public.app-category.video
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  writeUpdateInfo: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  uninstallDisplayName: Playbook
publish:
  provider: github
  owner: DiegoPinochet
  repo: playbook
  releaseType: release
  vPrefixedTagName: true
